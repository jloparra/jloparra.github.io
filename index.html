<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Demo funcional del MVP de TrackIU para validación con coaches.">
  <meta name="theme-color" content="#101513">
  <title>TrackIU · MVP funcional</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#inicio" aria-label="TrackIU, inicio">
        <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="TrackIU"><path d="M8 9h24M20 9v22M12 20h16"/><circle cx="20" cy="20" r="16"/></svg>
        <span>Track<span>IU</span></span>
      </a>
      <div class="context-card">
        <span class="eyebrow">Vista de demostración</span>
        <label for="role-switcher">Entrar como</label>
        <select id="role-switcher" aria-describedby="role-help">
          <option value="super_admin">Super admin</option>
          <option value="manager">Manager · Ana</option>
          <option value="trainer">Coach · Diego</option>
          <option value="athlete">Atleta · Lucía</option>
        </select>
        <p id="role-help">La navegación y las acciones cambian con los permisos.</p>
      </div>
      <nav id="primary-nav"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="button ghost full" type="button">Cambiar tema</button>
        <button id="reset-demo" class="button ghost full" type="button">Reiniciar demo</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button" type="button" aria-label="Abrir navegación">Menú</button>
        <div>
          <p class="eyebrow" id="context-label">TrackIU MVP</p>
          <h1 id="page-title">Inicio</h1>
        </div>
        <div class="topbar-actions">
          <span id="role-badge" class="badge">Super admin</span>
          <span id="save-state" class="save-state" aria-live="polite">Demo local</span>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section id="view" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <header class="modal-header">
        <div>
          <p class="eyebrow" id="modal-kicker">TrackIU</p>
          <h2 id="modal-title">Detalle</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Cerrar">Cerrar</button>
      </header>
      <div id="modal-content" class="modal-content"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
